controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - yaw_joint
      - radial_joint
      - lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5
      yaw_joint:
        trajectory: 0.1
        goal: 0.03
      radial_joint:
        trajectory: 0.05
        goal: 0.01
      lift_joint:
        trajectory: 0.05
        goal: 0.01
